<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>De‑identify a clinic letter</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main>
    <h1>Anonymise a clinic letter</h1>

    <label for="template">Template:</label>
    <select id="template">
      <option value="">– choose sample –</option>
    </select>

    <textarea id="letter" rows="12" placeholder="Paste or type your letter…"></textarea>

    <button id="run">Run &amp; time it</button>
    <span id="timing"></span>

    <h2>Output</h2>
    <pre id="output"></pre>
    <a id="download" href="#" download="clean_letter.txt" style="display:none;">Download cleaned text ⬇︎</a>
  </main>
</body>
</html>
